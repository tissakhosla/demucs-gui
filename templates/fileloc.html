{% extends 'base.html' %}
{% block title %}Upload Success{% endblock %}

{% block body %}
  <p>{% print(name) %}</p>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
  {% endwith %}
{% endblock %}
