<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{% block title %}{% endblock %} - demucsgui</title>
</head>
<header>
    <h1>demucs gui</h1>
    {% include 'cmp-userstats.html' %}
</header>

<body>
    {% block body %}{% endblock %}
</body>
<footer>
    <a href="{{ url_for('upload_file') }}">New File</a> 
    {% if login: %}
        <a href="{{ url_for('logout') }}">Logout</a>
    {% else: %}
        <a href="{{ url_for('login') }}">Login</a>
    {% endif %}
    <a href="{{ url_for('_help') }}">Help</a>
    <a href="{{ url_for('_samples') }}">Samples</a>
    <a href="{{ url_for('_license') }}">License</a>
</footer>
</html>
