<h1>Upload New File</h1>
<form method=post enctype=multipart/form-data>
    <label for="email">Enter your email:</label>
    <input type="email" id="email" name="email" required>
    <input type=file name=file required accept="audio/wav, audio/mp3">

    <p>Please select model:</p>

    {% for n, model in models: %}
        {% if not n %}
            <input type="radio" id="{{model}}" name="model" value="{{model}}" checked>
            <label for="{{model}}">{{model}}</label><br>
        {% else %}
            <input type="radio" id="{{model}}" name="model" value="{{model}}">
            <label for="{{model}}">{{model}}</label><br>
        {% endif %}
    {% endfor %}
    <input style="margin: 10px 0 0 10px;" type=submit value=Upload>
</form>
