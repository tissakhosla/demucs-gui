<form method=post enctype=multipart/form-data>

    <input type=file name=file required accept="audio/wav, audio/mp3"><br>
    <label class="label__email" for="email">Enter your email:</label>
    <input type="email" id="email" name="email" required>

    <p style="text-decoration: underline;">Select model:</p>
    <div class="models">
        {% for n, model in models: %}
        {% if not n %}
        <input type="radio" id="{{model}}" name="model" value="{{model}}" checked>
        <label for="{{model}}">{{model}}</label><br>
        {% else %}
        <input type="radio" id="{{model}}" name="model" value="{{model}}">
        <label for="{{model}}">{{model}}</label><br>
        {% endif %}
        {% endfor %}
    </div>
    <p style="text-decoration: underline;">Select output format:</p>
    <input type="radio" id="wav" name="output" value="wav" checked>
    <label for="wav">wav</label><br>
    <input type="radio" id="mp3" name="output" value="mp3">
    <label for="mp3">mp3</label><br>
    <div class="upload-button">
        <input type=submit value=Upload>
    </div>
</form>
<script src="{{ url_for('static', filename='script.js') }}"></script>
