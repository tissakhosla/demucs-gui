{% extends 'base.html' %}
{% block title %}New File{% endblock %}

{% block body %}
    <h1>Upload New File</h1>
    <form method=post enctype=multipart/form-data>
        <label for="email">Enter your email:</label>
        <input type="email" id="email" name="email" required>
        <input type=file name=file required accept="audio/wav, audio/mp3">
        
        <p>Please select model:</p>
        <input type="radio" id="htdemucs" name="model" value="htdemucs">
        <label for="htdemucs">htdemucs</label><br>
        <input type="radio" id="htdemucs_ft" name="model" value="htdemucs_ft">
        <label for="htdemucs_ft">htdemucs_ft</label><br>
        <input type="radio" id="htdemucs_6s" name="model" value="htdemucs_6s">
        <label for="htdemucs_6s">htdemucs_6s</label><br>
        <input type="radio" id="htdemucs_mmi" name="model" value="htdemucs_mmi">
        <label for="htdemucs_mmi">htdemucs_mmi</label><br>
        <input type="radio" id="mdx" name="model" value="mdx">
        <label for="mdx">mdx</label><br>
        <input type="radio" id="mdx_extra" name="model" value="mdx_extra">
        <label for="mdx_extra">mdx_extra</label><br>
        <input type="radio" id="mdx_q" name="model" value="mdx_q">
        <label for="mdx_q">mdx_q</label><br>
        <input type="radio" id="mdx_extra_q" name="model" value="mdx_extra_q">
        <label for="mdx_extra_q">mdx_extra_q</label><br>
        <input type=submit value=Upload>
    </form>
{% endblock %}
